name = "axom-hub-contact-relay"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# Comma-separated list of exact allowed browser origins (never use *).
# Temporary origin used only for the controlled contact relay test.
# Replace with the real Axom Hub HTTPS origin before production launch.
ALLOWED_ORIGINS = "https://axom-hub-test.example"

# APPS_SCRIPT_URL must remain a Cloudflare Worker runtime secret.
# Never commit its value to this file or expose it in VITE_* variables.
